<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caster Naina Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #063f39;
      --green-2: #0c5950;
      --green-3: #032f2b;
      --mint: #e8f6ef;
      --gold: #f6c545;
      --gold-2: #b87a05;
      --white: #fff;
      --dark: #031916;
      --shadow: 0 18px 45px rgba(0, 45, 38, 0.22);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      color: var(--green);
      background:
        radial-gradient(circle at 18% 10%, rgba(255,255,255,0.65), transparent 28%),
        radial-gradient(circle at 80% 25%, rgba(255,255,255,0.34), transparent 26%),
        linear-gradient(135deg, #c9e5dc 0%, #eef8f3 45%, #c7e5dc 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.25;
      background-image:
        linear-gradient(rgba(5, 55, 48, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(5, 55, 48, 0.12) 1px, transparent 1px);
      background-size: 6px 6px;
      mix-blend-mode: multiply;
      z-index: 0;
    }

    .mobile-layout,
    .desktop-layout {
      position: relative;
      z-index: 1;
    }

    .desktop-layout { display: none; }

    /* Prevent old/fallback content flash before Google Sheet data loads */
    body.is-loading .mobile-layout,
    body.is-loading .desktop-layout {
      opacity: 0;
      visibility: hidden;
    }

    body.is-ready .mobile-layout,
    body.is-ready .desktop-layout {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease;
    }

    .loading-skeleton {
      display: none;
    }


    /* ================= MOBILE LAYOUT ================= */

    .mobile-layout {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 18px 14px 38px;
    }

    .m-section {
      background:
        radial-gradient(circle at 80% 15%, rgba(255,255,255,0.10), transparent 25%),
        linear-gradient(145deg, var(--green-2), var(--green) 48%, var(--green-3));
      border-radius: 26px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .m-section::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 5px 5px;
      pointer-events: none;
      opacity: 0.7;
    }

    .m-hero {
      aspect-ratio: 16 / 9;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(90deg, rgba(3, 48, 44, 0.88) 0%, rgba(3, 48, 44, 0.48) 42%, rgba(3, 48, 44, 0.10) 100%);
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .m-hero-top {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .m-eyebrow {
      color: rgba(255,255,255,0.72);
      font-size: 10px;
      letter-spacing: 6px;
      font-weight: 500;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .m-hero h1 {
      font-family: "Playfair Display", serif;
      color: var(--white);
      font-size: clamp(34px, 8vw, 52px);
      line-height: 0.92;
      letter-spacing: -1px;
      text-transform: uppercase;
      text-shadow: 0 8px 22px rgba(0,0,0,0.32);
    }

    .m-menu {
      width: 25px;
      display: grid;
      gap: 5px;
      margin-top: 4px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .m-menu span {
      height: 2px;
      border-radius: 20px;
      background: rgba(255,255,255,0.72);
      display: block;
    }

    .m-about {
      position: relative;
      z-index: 2;
      color: rgba(255,255,255,0.94);
      font-size: 12px;
      line-height: 1.5;
      max-width: 310px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.55);
    }

    .m-about strong { color: #ffffff; font-weight: 800; }

    .m-action-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 16px;
      width: 100%;
    }

    .m-share {
      width: 160px;
      height: 46px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--green-2), var(--green));
      color: white;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 25px rgba(0, 55, 47, 0.24);
      cursor: pointer;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .m-promo {
      height: 46px;
      flex: 1;
      min-width: 0;
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.12) 23%, transparent 38%),
        linear-gradient(145deg, #fff4aa 0%, #f9cf4d 34%, #e7a916 62%, #a66b00 100%);
      color: #3a2400;
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(156, 103, 0, 0.30);
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 0 12px;
      text-transform: uppercase;
      animation: promoPulse 2.2s ease-in-out infinite;
    }

    .m-promo.show,
    .d-promo.show { display: inline-flex; }

    .m-promo::after,
    .d-promo::after {
      content: "";
      position: absolute;
      top: -40%;
      left: -60%;
      width: 42%;
      height: 180%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.82), transparent);
      transform: rotate(22deg);
      animation: promoShine 2.6s ease-in-out infinite;
      pointer-events: none;
    }

    .m-promo-track,
    .d-promo-track {
      position: relative;
      z-index: 2;
      white-space: nowrap;
      display: inline-flex;
      gap: 24px;
    }

    .m-promo-track.center,
    .d-promo-track.center {
      width: 100%;
      justify-content: center;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .m-promo-track.marquee,
    .d-promo-track.marquee {
      width: max-content;
      animation: promoMarquee 9s linear infinite;
    }

    @keyframes promoShine {
      0% { left: -65%; opacity: 0; }
      18% { opacity: 1; }
      55% { left: 125%; opacity: 1; }
      100% { left: 125%; opacity: 0; }
    }

    @keyframes promoPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.14); }
    }

    @keyframes promoMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-33.333%); }
    }

    .m-socials {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .m-socials a {
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(145deg, var(--green-2), var(--green));
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(0, 55, 47, 0.18);
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .m-socials svg {
      width: 23px;
      height: 23px;
      fill: white;
      position: relative;
      z-index: 2;
    }

    .m-banner {
      padding: 22px 18px 24px;
      margin-bottom: 22px;
    }

    .m-head {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .m-head h2 {
      font-family: "Playfair Display", serif;
      color: white;
      font-size: 19px;
      line-height: 1;
      letter-spacing: -0.2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .m-pill {
      color: var(--green);
      background: rgba(239,250,245,0.94);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }

    .m-scroll {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 4px 2px 12px;
      scrollbar-width: none;
    }

    .m-scroll::-webkit-scrollbar { display: none; }

    .m-video-card {
      min-width: 255px;
      scroll-snap-align: start;
      background: rgba(238, 250, 245, 0.96);
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.16);
    }

    .m-video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    .m-video-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .m-caption {
      padding: 9px 3px 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .m-caption h3 {
      font-size: 13px;
      color: var(--green);
      font-weight: 800;
      text-transform: uppercase;
    }

    .m-caption span {
      font-size: 10px;
      color: rgba(6,63,57,0.72);
      font-weight: 700;
    }

    .m-reel-card {
      min-width: 155px;
      scroll-snap-align: start;
      background: rgba(238, 250, 245, 0.96);
      border-radius: 18px;
      padding: 9px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.16);
      text-decoration: none;
      color: inherit;
    }

    .m-reel-thumb {
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .m-reel-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .m-play {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }

    .m-play::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 53%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-left: 17px solid var(--green);
    }

    .m-hint {
      position: relative;
      z-index: 2;
      color: rgba(255,255,255,0.72);
      font-size: 10px;
      font-weight: 600;
      margin-top: 4px;
    }

    .m-thank {
      padding: 34px 22px;
      text-align: center;
      margin-top: 6px;
    }

    .m-thank h2 {
      position: relative;
      z-index: 2;
      font-family: "Playfair Display", serif;
      color: white;
      font-size: 42px;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .m-thank p {
      position: relative;
      z-index: 2;
      color: rgba(255,255,255,0.78);
      font-size: 13px;
      line-height: 1.5;
      max-width: 330px;
      margin: 0 auto;
    }


    .title-shine {
      display: inline-block;
      color: transparent !important;
      background: linear-gradient(90deg, #ffffff 0%, #ffffff 28%, #fff0a3 44%, #f6c545 54%, #ffffff 72%, #ffffff 100%);
      background-size: 240% auto;
      -webkit-background-clip: text;
      background-clip: text;
      animation: titleShine 2.8s linear infinite;
      filter: drop-shadow(0 0 18px rgba(246,197,69,0.24));
    }

    @keyframes titleShine {
      0% { background-position: 160% center; }
      100% { background-position: -160% center; }
    }

    /* ================= DESKTOP LAYOUT ================= */

    @media (min-width: 768px) {
      body {
        background:
          radial-gradient(circle at 20% 20%, rgba(35, 145, 127, 0.24), transparent 28%),
          radial-gradient(circle at 85% 12%, rgba(255, 198, 62, 0.16), transparent 24%),
          radial-gradient(circle at 50% 95%, rgba(15, 94, 83, 0.34), transparent 34%),
          linear-gradient(135deg, #021b18 0%, #073c35 50%, #021b18 100%);
        color: #fff;
      }

      body::before {
        opacity: 0.13;
        background-image:
          linear-gradient(rgba(255,255,255,0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
        background-size: 12px 12px;
      }

      .mobile-layout { display: none; }
      .desktop-layout { display: block; }

      .d-shell {
        width: min(1440px, calc(100% - 64px));
        margin: 0 auto;
        padding: 34px 0 70px;
      }

      .d-nav {
        height: 76px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding: 0 24px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.055);
        backdrop-filter: blur(18px);
        border-radius: 28px;
        box-shadow: 0 20px 55px rgba(0,0,0,0.25);
      }

      .d-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        letter-spacing: 0.4px;
      }

      .d-brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #fff4aa, #f1b922 65%, #a66b00);
        color: #062b27;
        box-shadow: 0 14px 28px rgba(231,169,22,0.22);
      }

      .d-nav-links {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .d-nav-links a,
      .d-nav-links button {
        height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.08);
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .d-hero-banner {
        position: relative;
        overflow: hidden;
        min-height: 0;
        aspect-ratio: 16 / 9;
        border-radius: 42px;
        background:
          linear-gradient(90deg, rgba(3, 48, 44, 0.94) 0%, rgba(3, 48, 44, 0.82) 35%, rgba(3, 48, 44, 0.36) 62%, rgba(3, 48, 44, 0.06) 100%);
        background-size: cover;
        background-position: center;
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 30px 85px rgba(0,0,0,0.34);
        display: block;
        margin-bottom: 34px;
      }

      .d-hero-banner::after,
      .d-section::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 8px 8px;
        opacity: 0.55;
      }

      .d-copy {
        position: relative;
        z-index: 2;
        width: 52%;
        height: 100%;
        padding: 64px 58px 54px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .d-kicker {
        font-size: 13px;
        letter-spacing: 9px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.68);
        margin-bottom: 24px;
      }

      .d-title {
        font-family: "Playfair Display", serif;
        font-size: clamp(70px, 7vw, 114px);
        line-height: 0.82;
        letter-spacing: -4px;
        text-transform: uppercase;
        margin-bottom: 34px;
      }

      .d-title span {
        color: var(--gold);
        text-shadow: 0 20px 60px rgba(246,197,69,0.22);
      }

      .d-title .title-shine,
      .d-title span.title-shine {
        color: transparent !important;
        background: linear-gradient(90deg, #f6c545 0%, #f6c545 22%, #fff7bf 40%, #ffffff 50%, #ffd95a 62%, #f6c545 78%, #f6c545 100%);
        background-size: 260% auto;
        -webkit-background-clip: text;
        background-clip: text;
        animation: titleShine 2.4s linear infinite, titleGoldGlow 1.9s ease-in-out infinite;
        filter: drop-shadow(0 0 16px rgba(246,197,69,0.52)) drop-shadow(0 0 38px rgba(246,197,69,0.28));
      }

      @keyframes titleGoldGlow {
        0%, 100% { filter: drop-shadow(0 0 13px rgba(246,197,69,0.42)) drop-shadow(0 0 30px rgba(246,197,69,0.22)); }
        50% { filter: drop-shadow(0 0 22px rgba(255,239,150,0.95)) drop-shadow(0 0 58px rgba(246,197,69,0.68)) drop-shadow(0 0 110px rgba(246,197,69,0.30)); }
      }

      /* === DYNAMIC PREMIUM HOVERS WORKED HERE === */
      .d-nav-links a,
      .d-nav-links button,
      .d-btn,
      .d-see,
      .d-video-card,
      .d-reel-card,
      .d-stat {
        /* Ultra premium elastic cubic-bezier animation timing curve */
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                    box-shadow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15), 
                    filter 0.3s ease, 
                    background 0.3s ease;
      }

      .d-nav-links a:hover,
      .d-nav-links button:hover,
      .d-btn:hover,
      .d-see:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 18px 38px rgba(246,197,69,0.28), 0 0 24px rgba(246,197,69,0.2);
        filter: brightness(1.1);
      }

      .d-btn.primary:hover,
      .d-see:hover {
        background: linear-gradient(145deg, #fffcd3, #f6cb4b, #b87a05);
        box-shadow: 0 22px 48px rgba(246,197,69,0.5), 0 0 65px rgba(246,197,69,0.35);
      }

      .d-btn.secondary:hover,
      .d-nav-links a:hover,
      .d-nav-links button:hover {
        background: rgba(255,255,255,0.15);
        border-color: rgba(255,255,255,0.3);
        box-shadow: 0 16px 36px rgba(255,255,255,0.12), 0 0 42px rgba(246,197,69,0.22);
      }

      /* Video and Reels 3D depth popup effect */
      .d-video-card:hover,
      .d-reel-card:hover {
        transform: translateY(-12px) scale(1.035) rotateX(1deg);
        box-shadow: 0 35px 80px rgba(0,0,0,0.45), 0 0 30px rgba(232,246,239,0.15);
        filter: brightness(1.02);
      }

      .d-stat:hover {
        transform: translateY(-6px) scale(1.04);
        box-shadow: 0 22px 50px rgba(0,0,0,0.3);
        border-color: rgba(246,197,69,0.3);
      }

      .d-promo {
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, filter 0.3s ease;
        isolation: isolate;
        overflow: visible;
      }

      .d-promo:hover {
        transform: scale(1.08) translateY(-2px);
        filter: brightness(1.18);
        box-shadow: 
          0 25px 60px rgba(246,197,69,0.55), 
          0 0 45px rgba(246,197,69,0.4), 
          0 0 95px rgba(255,223,96,0.25);
        animation: promoHoverShock 1.35s ease-in-out infinite;
      }

      .d-promo::before {
        content: "";
        position: absolute;
        inset: -82px -118px;
        border-radius: 74px;
        background:
          radial-gradient(circle at 16% 48%, rgba(255,255,222,1), transparent 18%),
          radial-gradient(circle at 82% 48%, rgba(255,225,88,0.98), transparent 22%),
          radial-gradient(circle at 50% 50%, rgba(246,197,69,0.78), transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(255,166,0,0.32), transparent 62%);
        opacity: 0;
        transform: scale(0.35);
        filter: blur(26px);
        transition: opacity 0.45s ease, transform 0.55s cubic-bezier(.18,.8,.22,1), filter 0.45s ease;
        z-index: -2;
        pointer-events: none;
      }

      .d-promo:hover::before {
        opacity: 1;
        transform: scale(1.42);
        filter: blur(18px);
      }

      .d-promo::after {
        animation: none;
        left: -65%;
        opacity: 0;
      }

      .d-promo:hover::after {
        animation: promoShine 1.25s ease-in-out infinite;
      }

      @keyframes promoHoverShock {
        0%, 100% {
          box-shadow: 0 25px 60px rgba(246,197,69,0.55), 0 0 45px rgba(246,197,69,0.4), 0 0 95px rgba(255,223,96,0.25);
        }
        42% {
          box-shadow: 0 32px 85px rgba(246,197,69,0.88), 0 0 140px rgba(255,235,128,0.95), 0 0 250px rgba(246,197,69,0.68), 0 0 380px rgba(255,175,0,0.3);
        }
        68% {
          box-shadow: 0 25px 65px rgba(246,197,69,0.65), 0 0 100px rgba(246,197,69,0.52), 0 0 170px rgba(255,223,96,0.3);
        }
      }

      .d-about {
        max-width: 650px;
        color: rgba(255,255,255,0.80);
        font-size: 18px;
        line-height: 1.72;
        margin-bottom: 42px;
      }

      .d-about strong { color: #fff; }

      .d-ctas {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
        margin-bottom: 46px;
      }

      .d-btn {
        height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 18px;
        text-decoration: none;
        border: 0;
        cursor: pointer;
        font-weight: 900;
        font-size: 14px;
      }

      .d-btn.primary {
        color: #352300;
        background: linear-gradient(145deg, #fff4aa, #f2bd27, #a66b00);
        box-shadow: 0 16px 36px rgba(236,178,35,0.28);
      }

      .d-btn.secondary {
        color: #fff;
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.14);
      }

      .d-promo {
        height: 54px;
        padding: 0 22px;
        border-radius: 18px;
        display: none;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #3a2400;
        font-size: 13px;
        font-weight: 900;
        overflow: hidden;
        position: relative;
        max-width: 320px;
        min-width: 220px;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.12) 23%, transparent 38%),
          linear-gradient(145deg, #fff4aa 0%, #f9cf4d 34%, #e7a916 62%, #a66b00 100%);
        box-shadow: 0 16px 36px rgba(236,178,35,0.28);
        animation: promoPulse 2.2s ease-in-out infinite;
        text-transform: uppercase;
      }

      .d-promo-track {
        max-width: 100%;
        overflow: hidden;
      }

      .d-promo-track.marquee { overflow: visible; }

      .d-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .d-stat {
        border-radius: 24px;
        background: rgba(255,255,255,0.075);
        border: 1px solid rgba(255,255,255,0.10);
        padding: 22px;
      }

      .d-stat b {
        display: block;
        font-size: 28px;
        color: var(--gold);
        margin-bottom: 8px;
      }

      .d-stat span {
        color: rgba(255,255,255,0.68);
        font-size: 12px;
        font-weight: 700;
      }

      .d-visual { display: none; }

      .d-section {
        margin-top: 0;
        position: relative;
        overflow: hidden;
        border-radius: 42px;
        padding: 34px;
        background:
          radial-gradient(circle at 10% 10%, rgba(255,255,255,0.12), transparent 22%),
          linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.035));
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 28px 80px rgba(0,0,0,0.26);
      }

      .d-section + .d-section { margin-top: 34px; }

      .d-section-head {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .d-section h2 {
        font-family: "Playfair Display", serif;
        font-size: 44px;
        text-transform: uppercase;
        line-height: 1;
      }

      .d-see {
        color: #342100;
        background: #f3cb45;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 900;
      }

      .d-video-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .d-video-card,
      .d-reel-card {
        background: rgba(232,246,239,0.95);
        border-radius: 26px;
        padding: 12px;
        color: var(--green);
        text-decoration: none;
        box-shadow: 0 20px 48px rgba(0,0,0,0.24);
      }

      .d-video-frame {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: 20px;
        overflow: hidden;
        background: #000;
      }

      .d-video-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      .d-video-click-layer {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: block;
        background: transparent;
        cursor: pointer;
      }

      .d-card-cap {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 4px 2px;
        gap: 8px;
      }

      .d-card-cap h3 {
        font-size: 14px;
        text-transform: uppercase;
      }

      .d-card-cap span {
        font-size: 11px;
        font-weight: 900;
        opacity: 0.7;
      }

      .d-reel-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
      }

      .d-reel-thumb {
        position: relative;
        aspect-ratio: 9 / 16;
        border-radius: 20px;
        overflow: hidden;
        background: #000;
      }

      .d-reel-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .d-play {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(255,255,255,0.86);
        box-shadow: 0 10px 28px rgba(0,0,0,0.26);
      }

      .d-play::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 54%;
        transform: translate(-50%, -50%);
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-left: 18px solid var(--green);
      }
    }
  </style>
</head>

  <div class="desktop-layout">
    <div class="d-shell">
      <nav class="d-nav">

          <div class="d-brand-mark">✦</div>
          <span>NAINA</span>

        <div class="d-nav-links">
          <button id="dWatchBtn">Watch Videos</button>
          <button id="dInstaBtn">Instagram Reels</button>
          <a href="#" id="dNavInsta" target="_blank">Instagram</a>
          <a href="#" id="dNavYoutube" target="_blank">YouTube</a>
          <button onclick="shareProfile()" style="background:#fff; color:var(--green);">Share Profile</button>
        </div>
      </nav>

      <header class="d-hero-banner" id="dHeroBg">
        <div class="d-copy">
          <p class="d-kicker" id="dKicker">LOADER</p>
          <h1 class="d-title" id="dTitle">NAINA</h1>
          <p class="d-about" id="dAbout">...</p>
          <div class="d-ctas">
            <a href="#" id="dPrimaryCta" target="_blank" class="d-btn primary">Let's Connect</a>
            <a href="#" class="d-promo" id="dPromoBtn" target="_blank">
              <span class="d-promo-track" id="dPromoTrack">...</span>
            </a>
          </div>
          <div class="d-stats">
            <div class="d-stat"><b id="dStat1Val">00</b><span id="dStat1Lbl">...</span></div>
            <div class="d-stat"><b id="dStat2Val">00</b><span id="dStat2Lbl">...</span></div>
            <div class="d-stat"><b id="dStat3Val">00</b><span id="dStat3Lbl">...</span></div>
          </div>
        </div>
      </header>

      <section class="d-section" id="desktop-videos">
        <div class="d-section-head">
          <h2>Featured Videos</h2>
          <a href="#" id="dVideosMore" target="_blank" class="d-see">See More Videos</a>
        </div>
        <div class="d-video-grid" id="dVideos"></div>
      </section>

      <section class="d-section" id="desktop-reels">
        <div class="d-section-head">
          <h2>Reels & Shorts</h2>
          <a href="#" id="dReelsMore" target="_blank" class="d-see">See More Reels</a>
        </div>
        <div class="d-reel-grid" id="dReels"></div>
      </section>
    </div>
  </div>


  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbygG43Fiaf3Q7O2O2Zg99kG_XbYgLAtB7Xb-b0bC1mN2fFm5hUAsuA699WjGz8H1B2A/exec";

    let shareTitle = "Caster Naina Portfolio";
    let shareText = "Check out Caster Naina's live talent showcase portfolio!";

    function pauseAllVideos() {
      document.querySelectorAll("iframe").forEach(iframe => {
        const src = iframe.src;
        iframe.src = "";
        iframe.src = src;
      });
    }

    function createMarqueeTrack(text, trackElement) {
      if (!text || text.trim() === "") {
        trackElement.parentElement.classList.remove("show");
        return;
      }
      trackElement.parentElement.classList.add("show");

      if (text.length > 28) {
        trackElement.className = trackElement.className.replace("center", "marquee");
        trackElement.innerHTML = `<span>${text}</span><span>${text}</span><span>${text}</span>`;
      } else {
        trackElement.className = trackElement.className.replace("marquee", "center");
        trackElement.innerHTML = `<span>${text}</span>`;
      }
    }

    function renderDynamicSheetData(data) {
      if (!data) return;

      const meta = data.meta || {};
      const stats = data.stats || [];
      const videos = data.videos || [];
      const reels = data.reels || [];

      if (meta.shareTitle) shareTitle = meta.shareTitle;
      if (meta.shareText) shareText = meta.shareText;

      const heroImg = meta.heroImage || "";
      if (heroImg !== "") {
        const mHero = document.getElementById("mHeroBg");
        const dHero = document.getElementById("dHeroBg");
        if (mHero) mHero.style.backgroundImage = `linear-gradient(90deg, rgba(3,48,44,0.88) 0%, rgba(3,48,44,0.48) 42%, rgba(3,48,44,0.10) 100%), url('${heroImg}')`;
        if (dHero) dHero.style.backgroundImage = `linear-gradient(90deg, rgba(3,48,44,0.96) 0%, rgba(3,48,44,0.85) 35%, rgba(3,48,44,0.36) 62%, rgba(3,48,44,0.06) 100%), url('${heroImg}')`;
      }

      // Populate Elements safely
      const binders = [
        { id: "mKicker", val: meta.kicker },
        { id: "dKicker", val: meta.kicker },
        { id: "mTitle", val: meta.name, classes: "title-shine" },
        { id: "dTitle", val: meta.name, classes: "title-shine" },
        { id: "mAbout", val: meta.aboutHtml, isHtml: true },
        { id: "dAbout", val: meta.aboutHtml, isHtml: true },
        { id: "mThankHead", val: meta.thankYouHeader },
        { id: "mThankSub", val: meta.thankYouSub },
        { id: "dVideosMore", val: null, href: meta.moreVideosUrl },
        { id: "dReelsMore", val: null, href: meta.moreReelsUrl },
        { id: "dPrimaryCta", val: meta.primaryCtaText, href: meta.primaryCtaUrl },
        { id: "mInsta", val: null, href: meta.instagramUrl },
        { id: "dNavInsta", val: null, href: meta.instagramUrl },
        { id: "mYoutube", val: null, href: meta.youtubeUrl },
        { id: "dNavYoutube", val: null, href: meta.youtubeUrl },
        { id: "mLinkedin", val: null, href: meta.linkedinUrl },
        { id: "mTwitter", val: null, href: meta.twitterUrl }
      ];

      binders.forEach(b => {
        const elements = document.querySelectorAll(`#${b.id}`);
        elements.forEach(el => {
          if (b.href !== undefined) {
            if (b.href) { el.href = b.href; el.style.display = ""; }
            else { el.style.display = "none"; }
          }
          if (b.val !== undefined && b.val !== null) {
            if (b.isHtml) el.innerHTML = b.val;
            else el.textContent = b.val;
          }
          if (b.classes) el.classList.add(b.classes);
        });
      });

      // Banners Config
      const mTrack = document.getElementById("mPromoTrack");
      const dTrack = document.getElementById("dPromoTrack");
      const pUrl = meta.promoUrl || "#";
      
      if (mTrack) {
        createMarqueeTrack(meta.promoText, mTrack);
        document.querySelectorAll("#mPromoBtn").forEach(a => a.href = pUrl);
      }
      if (dTrack) {
        createMarqueeTrack(meta.promoText, dTrack);
        document.querySelectorAll("#dPromoBtn").forEach(a => a.href = pUrl);
      }

      // Stats Population
      for (let i = 0; i < 3; i++) {
        const s = stats[i] || { value: "-", label: "" };
        const valEl = document.getElementById(`dStat${i+1}Val`);
        const lblEl = document.getElementById(`dStat${i+1}Lbl`);
        if (valEl) valEl.textContent = s.value;
        if (lblEl) lblEl.textContent = s.label;
      }

      // Videos Output Generation
      let mVideosHtml = "";
      let dVideosHtml = "";
      videos.forEach(v => {
        mVideosHtml += `
          <div class="m-video-card">
            <div class="m-video-frame"><iframe src="${v.embedUrl}" allowfullscreen loading="lazy"></iframe></div>
            <div class="m-caption"><h3>${v.title}</h3><span>${v.duration}</span></div>
          </div>`;
        dVideosHtml += `
          <div class="d-video-card">
            <div class="d-video-frame">
              <div class="d-video-click-layer" onclick="pauseAllVideos()"></div>
              <iframe src="${v.embedUrl}" allowfullscreen loading="lazy"></iframe>
            </div>
            <div class="d-card-cap"><h3>${v.title}</h3><span>${v.duration}</span></div>
          </div>`;
      });
      const mVidBox = document.getElementById("mVideos");
      const dVidBox = document.getElementById("dVideos");
      if (mVidBox) mVidBox.innerHTML = mVideosHtml || "<p style='color:white;font-size:12px;'>No videos setup yet.</p>";
      if (dVidBox) dVidBox.innerHTML = dVideosHtml || "<p style='color:white;font-size:14px;'>No videos setup yet.</p>";

      // Reels Output Generation
      let mReelsHtml = "";
      let dReelsHtml = "";
      reels.forEach(r => {
        mReelsHtml += `
          <a class="m-reel-card" href="${r.linkUrl}" target="_blank">
            <div class="m-reel-thumb"><div class="m-play"></div><img src="${r.thumbUrl}" alt="Reel Thumbnail" loading="lazy" /></div>
          </a>`;
        dReelsHtml += `
          <a class="d-reel-card" href="${r.linkUrl}" target="_blank">
            <div class="d-reel-thumb"><div class="d-play"></div><img src="${r.thumbUrl}" alt="Reel Thumbnail" loading="lazy" /></div>
          </a>`;
      });
      const mReelBox = document.getElementById("mReels");
      const dReelBox = document.getElementById("dReels");
      if (mReelBox) mReelBox.innerHTML = mReelsHtml || "<p style='color:white;font-size:12px;'>No reels setup yet.</p>";
      if (dReelBox) dReelBox.innerHTML = dReelsHtml || "<p style='color:white;font-size:14px;'>No reels setup yet.</p>";
    }

    function loadSheetData() {
      fetch(SHEET_API_URL)
        .then(response => response.json())
        .then(data => {
          renderDynamicSheetData(data);
          document.body.classList.remove("is-loading");
          document.body.classList.add("is-ready");
        })
        .catch(error => {
          console.error("Error connecting with portfolio pipeline sheet architecture:", error);
          document.body.classList.remove("is-loading");
          document.body.classList.add("is-ready");
        });
    }

    function scrollToPortfolioSection(sectionId) {
      const el = document.getElementById(sectionId);
      if (!el) return;
      const topOffset = 110; 
      const sectionTop = el.getBoundingClientRect().top + window.pageYOffset - topOffset;

      window.scrollTo({
        top: sectionTop,
        behavior: "smooth"
      });
    }

    function setupHeroScrollButtons() {
      const watchBtn = document.getElementById("dWatchBtn");
      const reelsBtn = document.getElementById("dInstaBtn");

      if (watchBtn) {
        watchBtn.addEventListener("click", function(event) {
          event.preventDefault();
          scrollToPortfolioSection("desktop-videos");
        });
      }

      if (reelsBtn) {
        reelsBtn.addEventListener("click", function(event) {
          event.preventDefault();
          scrollToPortfolioSection("desktop-reels");
        });
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) pauseAllVideos();
    });

    function shareProfile() {
      pauseAllVideos();
      const shareData = {
        title: shareTitle,
        text: shareText,
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).then(() => alert("Profile link copied!\nShare it with everyone."));
      } else {
        alert("Share option is not supported on this browser.");
      }
    }

    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    }, true);

    setupHeroScrollButtons();
    loadSheetData();
  </script>
</body>
